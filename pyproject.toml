[project]
name = "ai-governance-pack"
version = "0.1.0"
description = "AI governance pack (system card, risk register, EU AI Act memo, NIST AI RMF mapping, UAE notes) for the Lumi Skin customer-service agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sara Hebbadj" }]
requires-python = ">=3.11"
dependencies = []  # the validator uses only the Python standard library

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
